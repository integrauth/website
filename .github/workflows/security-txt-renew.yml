# Keeps .well-known/security.txt fresh (RFC 9116 treats it as stale past its Expires date).
# Runs monthly; when Expires is within 60 days it bumps it exactly one year forward and pushes.
# Replaces the old Claude-scheduled yearly reminder so renewal never depends on any external
# subscription.
#
# DELIVERY OF THE RENEWED FILE. On GitHub Pages (pre-2026-08 cutover) the push alone redeployed.
# On the Cloudflare Worker, the live site is the ASSET SNAPSHOT from the last `wrangler deploy`, and
# the push below is made with GITHUB_TOKEN — whose commits deliberately do NOT trigger the
# `ci-deploy` workflow (GitHub's recursive-run guard). So a push on its own would leave the renewed
# security.txt committed but unserved until some unrelated push happened to redeploy — a quiet way
# to serve a stale, past-Expires file. The final step therefore explicitly dispatches ci-deploy,
# which IS delivered even from GITHUB_TOKEN — a straight production redeploy since the cutover. If
# the dispatch ever fails or is a no-op, behaviour is no worse than before (next real push redeploys).
#
# Caveat: GitHub disables scheduled workflows after 60 days without repo activity. This repo gets
# regular commits (and the bump itself is a commit), so in practice the schedule stays alive — but
# if the repo ever goes fully dormant, re-enable it under Actions → this workflow → "Enable".
name: Renew security.txt expiry

on:
  schedule:
    - cron: '17 4 3 * *' # 04:17 UTC on the 3rd of every month (odd minute avoids peak-load skips)
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write # to dispatch ci-deploy after the bump (see the delivery note above)

jobs:
  renew:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bump Expires if within 60 days
        id: bump
        run: |
          set -euo pipefail
          FILE=.well-known/security.txt
          CURRENT=$(grep -oP '^Expires: \K.*' "$FILE")
          NOW_S=$(date -u +%s)
          EXP_S=$(date -u -d "$CURRENT" +%s)
          DAYS_LEFT=$(( (EXP_S - NOW_S) / 86400 ))
          echo "Expires: $CURRENT ($DAYS_LEFT days left)"
          if [ "$DAYS_LEFT" -gt 60 ]; then
            echo "Fresh enough — nothing to do."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          NEW=$(date -u -d "$CURRENT + 1 year" +%Y-%m-%dT00:00:00.000Z)
          sed -i "s|^Expires: .*|Expires: $NEW|" "$FILE"
          echo "Bumped to $NEW"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "new=$NEW" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        if: steps.bump.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .well-known/security.txt
          git commit -m "chore: renew security.txt Expires to ${{ steps.bump.outputs.new }} (RFC 9116 yearly renewal)"
          git push

      # Push it out to the Worker. The commit above was made with GITHUB_TOKEN and so does NOT
      # trigger ci-deploy's `push:` run — this explicit dispatch does (workflow_dispatch is delivered
      # even from GITHUB_TOKEN). Without it the renewed file sits committed but unserved until the
      # next unrelated deploy. Best-effort: never fail the renewal itself over a dispatch hiccup.
      - name: Redeploy the Worker so the renewed file is served
        if: steps.bump.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          if gh workflow run ci-deploy --ref main; then
            echo "Dispatched ci-deploy to serve the renewed security.txt."
          else
            echo "::warning::Could not dispatch ci-deploy. The renewed security.txt is committed but"\
                 "will only reach the Worker on the next deploy. Trigger 'ci-deploy' manually if the"\
                 "served copy is past its Expires date."
          fi
