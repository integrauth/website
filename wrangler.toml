name = "integrauth-website"
# The IntegrAuth Cloudflare account — same account as the sister `integrauth/lab` repo.
# Committed (account ids are not secrets) so wrangler works from any checkout without discovery.
account_id = "caf8f7aaecfdec65f1b9f5ac8185f750"
main = "src/worker.ts"
compatibility_date = "2025-06-20"
compatibility_flags = ["nodejs_compat"]

# --- Custom domain / workers.dev ---
# Cut over 2026-08: this Worker serves integrauth.com and www.integrauth.com directly, same
# `custom_domain = true` pattern the sister `integrauth/lab` repo already uses for
# lab.integrauth.com. That is the one canonical origin real visitors ever see.
#
# `workers_dev` is (re-)ENABLED as of 2026-08-01, deliberately, purely so CI has a URL to probe.
# The zone's Bot Fight Mode / Managed Challenge intercepts GitHub Actions runner traffic hitting
# the custom domain before it ever reaches this Worker (confirmed: identical curls from outside CI
# get a normal 200, the runner gets Cloudflare's "Just a moment..." managed-challenge page) — so
# `ci-deploy`'s Smoke probe and Certificate signing key continuity steps target the `*.workers.dev`
# URL instead (see deploy.yml), which sits outside the zone's bot rules entirely. This is a CI-only
# convenience, not a second public origin: nothing links to it, and `isAllowedOrigin` (api.ts)
# already allows it via the same-origin branch — that branch predates this and was written for
# exactly this kind of non-production host, so no code change was needed to re-enable it safely.
#
# BEFORE THIS CAN DEPLOY (both manual, one-time, Cloudflare-dashboard steps — not something any
# script in this repo does): the Cloudflare API token behind CF_TOKEN needs `Workers Routes:Edit` +
# `DNS:Edit` + `Zone:Read` on the integrauth.com zone (previously just `Workers Scripts:Edit` +
# `D1:Read`); and the zone's existing DNS records for both hostnames — previously pointing at
# GitHub Pages — need to be clear of conflicts, since Wrangler has no CLI/CI-usable override for a
# pre-existing non-Workers record at the same hostname (see cloudflare/workers-sdk#9878) and a
# `wrangler deploy` that hits one fails outright rather than taking it over. If this file has
# already deployed cleanly, both are done; if not, do them first, then merge/redeploy.
routes = [
  { pattern = "integrauth.com", custom_domain = true },
  { pattern = "www.integrauth.com", custom_domain = true }
]
workers_dev = true

# --- Static assets ---
# Serves the existing static site (index.html, academy.html, css/, js/, images/, etc.)
# straight from the repo root — GitHub Pages served this same directory pre-2026-08 cutover.
# See .assetsignore for what is deliberately NOT published (notably `.git`).
#
# LOCAL DEV GOTCHA: because the assets directory IS the repo root, wrangler's own local state
# directory (`.wrangler/`) sits *inside* the tree it watches — so a plain `wrangler dev` writes
# state, retriggers its own watcher, and reload-loops forever without ever serving a request.
# Always run it via `npm run worker:dev`, which passes `--persist-to ../.wrangler-state` to put
# that state outside the watched tree. (Verified: 250+ reloads/minute before, 1 after.)
[assets]
binding = "ASSETS"
directory = "."

# Only /api/academy/* and /auth/* are routed to the Worker; every other request is answered
# directly by Cloudflare's asset server without a Worker invocation (faster, and no per-asset
# Worker request billed for ~200 static files incl. 43 logos). Security headers for those static
# responses come from the `_headers` file at the repo root instead of from security.ts —
# keep the two in sync when either changes.
#
# KEEP IN SYNC with the path prefixes src/worker.ts dispatches on. A prefix the Worker handles but
# that is missing here never reaches the Worker at all — the asset server answers it first, and the
# symptom is a plain 404 on a route that looks correctly implemented. /auth/* is the OIDC Relying
# Party surface (login start, callback, session, logout, back-channel logout).
run_worker_first = ["/api/academy/*", "/auth/*"]

# Serve the repo's custom 404.html for unmatched paths. WITHOUT this, the default is "none",
# which returns a bare bodyless 404 — i.e. the custom 404 page GitHub Pages used to serve would
# silently stop working after the cutover. (Verified: default "none" returns Content-Length: 0.)
not_found_handling = "404-page"

# Left at the default "auto-trailing-slash", which is what makes the site's extensionless URL
# convention work: /academy serves academy.html, and /academy.html 307-redirects to /academy.
# Verified locally against the real asset server — do not change without re-testing every page.
html_handling = "auto-trailing-slash"

# --- D1 database ---
# SHARED with the `integrauth/lab` repo — this is the SAME physical D1 instance
# (lab-db), not a copy. Schema/migrations for it are owned by the `integrauth/lab`
# repo. This Worker only:
#   - reads (never writes) the Lab-owned `users` table, to learn whether the account
#     behind a session is still active and what address to show in the navbar. It does
#     NOT touch the Lab-owned `sessions` table at all — that was true of an earlier
#     shared-cookie design that was withdrawn; this Worker now mints and validates its
#     own sessions only.
#   - reads/writes its OWN tables: website_sessions, profiles, academy_lesson_progress,
#     academy_quiz_progress, academy_last_position, academy_exam_attempts,
#     academy_certificates, academy_progress_epoch.
# Never run migrations from this repo against this database, and never alter any
# Lab-owned table from here.
[[d1_databases]]
binding = "DB"
database_name = "lab-db"
database_id = "9318da4d-88cc-4e0d-9b3d-7c46eff548e8"

# ENABLED 2026-08-15, after the explanation for its previous failure was measured false. The
# history is kept deliberately: this block sat off on a diagnosis that was wrong, and the
# correction is worth more than a clean comment.
#
# One job: erase exam `ip_hash` values past their 24-hour retention window (audit finding
# R22-W-02). privacy.html promises that erasure unconditionally, but the only other thing that
# performs it is the next exam submission — so on a quiet week the most recent hashes outlive the
# promise, and the last attempt before traffic stops is never scrubbed at all. The handler is
# `scheduled` in src/worker.ts, which touches nothing else and no Lab-owned table.
#
# WHY IT WAS OFF, and why that reason did not survive contact with the API. Deploy run #49
# (2026-08-14) failed with:
#
#   Some triggers failed to deploy for integrauth-website:
#     - A request to the Cloudflare API (/accounts/…/workers/scripts/integrauth-website/schedules)
#       failed.
#
# The script itself uploaded fine; only the schedules call was refused. Disabling it was the right
# call at the time — a red deploy blocks EVERY subsequent website deploy, which is worse than the
# retention gap it was closing.
#
# The cause was then recorded as "CF_TOKEN is missing a scope that covers cron triggers", because
# wrangler swallowed the API's response body and nobody could see otherwise. **That is now MEASURED
# FALSE**, by calling the endpoint directly from the deploy job with this same token:
#
#   GET  /accounts/…/workers/scripts/integrauth-website/schedules  -> 200 {"schedules":[]}
#   PUT  (same URL, body [] — the list it already had)             -> 200 {"schedules":[]} success
#
# **The token can already READ and WRITE this Worker's schedules.** A permission it demonstrably has
# cannot be the permission it is missing. Corroborating: Cloudflare publishes no cron or schedules
# permission group at all (the Workers account permissions are Workers Scripts, Workers KV,
# Workers R2, Workers Tail, Workers Builds Configuration, Workers Observability, Account Settings),
# and the documented requirement for this endpoint is Workers Scripts:Write — which the deploy step
# exercises seconds earlier every single run.
#
# So run #49's failure was NOT authorization, and widening the token would have fixed nothing.
#
# THE LESSON, and the reason this comment is long: an error whose body nobody read produced a
# confident wrong cause; that cause was written down as fact; and it then justified leaving a
# privacy promise unkept for a day. One direct call to the endpoint settled it. **Read the error
# before naming the cause.**
#
# If this ever fails again: revert these two lines FIRST, because a red deploy blocks every other
# deploy — then reproduce it against the endpoint directly rather than through wrangler, which does
# not surface the API's response.
[triggers]
crons = ["23 * * * *"]

[vars]
# Same Turnstile site key the Lab uses (committed there too — a Turnstile SITE key is the public
# half of the widget, safe to commit; only TURNSTILE_SECRET is sensitive). Both apps share one
# widget — scripts/provision-cf.sh in the lab repo keeps integrauth.com/www.integrauth.com in that
# widget's allowed-domains list. If the widget is ever re-created, update this value AND the lab
# repo's wrangler.toml together (both must carry the same site key).
PUBLIC_TURNSTILE_SITE_KEY = "0x4AAAAAAD3VSnt3hqHZSCXw"

# --- OIDC Relying Party (see src/lib/server/oidc-rp.ts) ---
# This site authenticates users by redirecting to the Lab's OpenID Provider and exchanging an
# authorization code — it does NOT share a session cookie with the Lab (that design was rejected;
# src/lib/server/session.ts's header explains why at length).
#
# Both values are non-secret identifiers, hence [vars] rather than Wrangler secrets. The issuer must
# match the `iss` claim byte for byte, so no trailing slash.
LAB_ISSUER = "https://lab.integrauth.com"
OIDC_CLIENT_ID = "integrauth-website"

# NOT here, and must never be committed: IA_WEBSITE_OIDC_SECRET — the client secret for the
# `integrauth-website` OIDC client. THE SAME RAW VALUE must exist in the `integrauth/lab` Worker
# under the same name; the Lab stores only its SHA-256, so it can never be read back or compared.
#
# Provision it as ONE GitHub Secret named IA_WEBSITE_OIDC_SECRET — organisation-level, shared to this
# repo AND integrauth/lab — and each repo's deploy workflow mirrors it into its own Worker. Rotating
# is then "change the GitHub Secret, redeploy both". Neither CI ever GENERATES it: a value one side
# invented would be one the other does not know, and a generated Wrangler secret is masked out of the
# log and unreadable afterwards, so nobody could tell the other side what to match.
#
#   openssl rand -base64 32     # once, then paste into the GitHub Secret
#
# For a purely local run, `.dev.vars` (gitignored, and in .assetsignore) does the same job.
#
# Until it is set, `rpConfigFromEnv()` returns null and the /auth routes answer 503
# `sign_in_unavailable`; the rest of the site is unaffected, which is deliberate so the Worker can be
# deployed before the secret is provisioned.
#
# ALSO REQUIRED, on the Lab side: this site's callback URL must appear VERBATIM in the Lab's
# IA_WEBSITE_REDIRECT_URIS (comma-separated, max 5, exact string match at request time — no
# host/port/scheme laxity, NO trailing slash). The two production entries are committed there
# already. This repo's deploy prints its own callback into the run summary for cross-checking if
# sign-in ever fails `invalid_client_or_redirect`.

[observability]
enabled = true
